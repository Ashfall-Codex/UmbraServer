# Chaque push sur main est fusionné dans apple-arm-support, puis les images Apple Silicon sont reconstruites.
# Atrama (agent launchd) récupère ensuite la nouvelle version tout seul : main devient testable en pré-prod
# quelques minutes après le push, avant tout ./deploy.sh vers la prod.
#
# La fusion passe par l'API GitHub : le commit de fusion est signé par GitHub (« Verified »),
# auteur github-actions[bot]. En cas de conflit, le job échoue (notification GitHub) et rien n'est poussé :
# il faut alors fusionner à la main sur Adhara.
name: Synchro main → apple-arm-support

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # fusion dans apple-arm-support
  actions: write    # déclenchement du build des images

concurrency:
  group: sync-apple-arm
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Fusion de main dans apple-arm-support
        id: merge
        run: |
          short="${GITHUB_SHA::7}"
          set +e
          out=$(gh api -X POST "repos/$REPO/merges" \
                -f base=apple-arm-support -f head="$GITHUB_SHA" \
                -f commit_message="Fusion automatique de main ($short)" \
                -i 2>&1)
          set -e
          status=$(echo "$out" | head -1 | awk '{print $2}')
          case "$status" in
            201) echo "Fusion faite : apple-arm-support contient maintenant $short" ;;
            204) echo "Rien à fusionner : apple-arm-support contient déjà $short" ;;
            409) echo "::error::Conflit entre main ($short) et apple-arm-support : fusionne à la main sur Adhara (git merge -S main)"; exit 1 ;;
            *)   echo "::error::Fusion impossible (HTTP $status)"; echo "$out" | tail -5; exit 1 ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Un push fait avec GITHUB_TOKEN ne déclenche pas les autres workflows (protection anti-boucle de GitHub),
      # mais workflow_dispatch reste autorisé : on lance donc le build explicitement.
      - name: Build des images Apple Silicon
        if: steps.merge.outputs.status == '201'
        run: gh workflow run apple-arm-images.yml --repo "$REPO" --ref apple-arm-support
