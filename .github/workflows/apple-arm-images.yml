# Images linux/arm64 de server, auth et files pour l'environnement de dev sur Mac Apple Silicon.
# Déclenché uniquement par un push sur apple-arm-support. Atrama interroge GHCR et déploie
# (deploy/apple-container/dev-container.sh update, lancé par launchd).
#
# Tags publiés : ghcr.io/ashfall-codex/umbra-<service>:apple-arm-support et :sha-<7 caractères>.
# La compilation .NET tourne en x64 et vise arm64 (voir le Dockerfile) : aucune émulation.
name: Images Apple Silicon

on:
  push:
    branches: [apple-arm-support]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: apple-arm-images
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: server
            project: UmbraSyncServer
          - service: auth
            project: UmbraSyncAuthService
          - service: files
            project: UmbraSyncStaticFilesServer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Noms d'image
        id: meta
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/umbra-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/apple-container/Dockerfile
          platforms: linux/arm64
          build-args: PROJECT=${{ matrix.project }}
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:apple-arm-support
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
