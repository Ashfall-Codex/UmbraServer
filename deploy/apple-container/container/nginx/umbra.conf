# Point d'entrée unique de l'environnement de dev, calqué sur la prod (umbra-sync.net).
# En dev : HTTP simple sur le port 80 (le plugin ignore le port pour le well-known), pas de TLS.

# Connection : "upgrade" pour les websockets du hub, vide sinon (keepalive vers l'amont)
map $http_upgrade $connection_upgrade {
    default     "";
    "~*websocket" "upgrade";
}

upstream mare_server { server umbra-server.test:6100; keepalive 10; }
upstream mare_auth   { server umbra-auth.test:6101;   keepalive 10; }
upstream mare_files  { server umbra-files.test:6102;  keepalive 10; }

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # $http_host garde le port (utile si on change de port) : le well-known construit ses URL à partir de l'hôte reçu
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_http_version 1.1;
    # Attention : un seul proxy_set_header dans un location annule TOUS ceux du server. Il n'y en a donc aucun en dessous.

    # --- mare-server : hub SignalR et contrôleurs /main
    location /mare {
        proxy_pass http://mare_server;
        proxy_read_timeout 1800;
        proxy_send_timeout 1800;
        client_max_body_size 100M;
    }
    location /main/ {
        proxy_pass http://mare_server;
    }

    # --- mare-auth : jetons, inscription, découverte
    location /auth/ {
        proxy_pass http://mare_auth;
    }
    location /discovery/ {
        proxy_pass http://mare_auth;
    }
    location /.well-known/ {
        proxy_pass http://mare_auth;
    }

    # --- mare-files : envois, cache, files d'attente
    location ~ ^/(files|cache|request|dist|speedtest)/ {
        proxy_pass http://mare_files;
        client_max_body_size 200M;
        proxy_read_timeout 1800;
        proxy_send_timeout 1800;
        proxy_connect_timeout 5;
    }

    # Tout le reste (dont /msgc, /configuration) n'est pas exposé
    location / { return 404; }
}
